repos:
- repo: local 
  hooks:
    - id: lint
      name: Ruff Lint
      description: Linting using ruff
      entry: bash -c 'ruff check .'
      language: system
      stages: ["pre-commit", "pre-push"]

    - id: format
      name: Ruff Format
      description: Formatting using ruff
      entry: bash -c 'ruff format . --check'
      language: system
      stages: ["pre-commit", "pre-push"]

    - id: mypy
      name: mypy
      description: Static type checking using mypy
      entry: bash -c 'mypy'
      language: system
      pass_filenames: false
      stages: ["pre-commit", "pre-push"]
